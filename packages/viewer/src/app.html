<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <title>Dynamic Share</title>
    %sveltekit.head%
    <style>
      html { background: #06080f; }
      #boot-splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #06080f; z-index: 9999;
      }
      #boot-splash .dot {
        width: 10px; height: 10px; border-radius: 9999px; background: #8b5cf6;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      @keyframes boot-pulse { 0%,100% { opacity: .3; transform: scale(.8);} 50% { opacity: 1; transform: scale(1);} }
    </style>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot-splash" aria-hidden="true"><div class="dot"></div></div>
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      document.getElementById("boot-splash")?.remove();
    </script>
  </body>
</html>
